<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model 3 Live CAN</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --panel: #18181c;
    --border: #2a2a32;
    --accent: #e31937;
    --accent-dim: #8a0f20;
    --text: #e8e8ec;
    --text-dim: #7a7a88;
    --green: #22c55e;
    --yellow: #f59e0b;
    --flash: #3a3a10;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Mono', monospace;
    font-size: 13px;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ---- sidebar ---- */
  #sidebar {
    width: 200px;
    min-width: 160px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar-header {
    padding: 14px 12px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-dim);
  }

  #sidebar-header span {
    display: block;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    text-transform: none;
    letter-spacing: 0;
    margin-bottom: 2px;
  }

  #node-list {
    overflow-y: auto;
    flex: 1;
    padding: 6px 0;
  }

  .node-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 7px 14px;
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    font: inherit;
    border-left: 3px solid transparent;
    transition: background .1s, border-color .1s;
  }
  .node-btn:hover { background: rgba(255,255,255,.04); }
  .node-btn.active {
    background: rgba(227,25,55,.1);
    border-left-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  /* ---- main area ---- */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #topbar {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #node-title {
    font-size: 16px;
    font-weight: 700;
    flex: 1;
  }

  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #444;
    flex-shrink: 0;
  }
  #status-dot.connected { background: var(--green); }
  #status-dot.error     { background: var(--accent); }

  #status-text { color: var(--text-dim); font-size: 12px; }

  #filter-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    color: var(--text);
    font: inherit;
    width: 180px;
  }
  #filter-input:focus { outline: none; border-color: var(--accent-dim); }

  #fps-counter {
    color: var(--text-dim);
    font-size: 11px;
    min-width: 60px;
    text-align: right;
  }

  /* ---- signal table ---- */
  #table-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 0 18px 18px;
  }

  .msg-section {
    margin-top: 16px;
  }

  .msg-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 5px 0 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }

  .msg-name { font-weight: 600; font-size: 12px; }
  .msg-id   { color: var(--text-dim); font-size: 11px; }
  .msg-age  {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
    min-width: 60px;
    text-align: right;
  }
  .msg-age.stale { color: var(--accent); }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  td {
    padding: 3px 6px;
    border-bottom: 1px solid rgba(255,255,255,.03);
    vertical-align: middle;
  }

  .sig-name  { color: var(--text-dim); width: 55%; }
  .sig-value {
    font-weight: 600;
    font-size: 13px;
    transition: background .05s;
  }
  .sig-value.flash { background: var(--flash); }
  .sig-units { color: var(--text-dim); font-size: 11px; padding-left: 4px; }
  .sig-label { color: var(--yellow); font-size: 11px; padding-left: 4px; }

  #placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
    color: var(--text-dim);
  }
  #placeholder .big { font-size: 38px; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <span>Model 3 CAN</span>
    ECU nodes
  </div>
  <div id="node-list"><div style="padding:12px;color:var(--text-dim)">Connecting…</div></div>
</div>

<div id="main">
  <div id="topbar">
    <div id="node-title">Select a node</div>
    <input id="filter-input" type="text" placeholder="Filter signals…" style="display:none">
    <div id="fps-counter"></div>
    <div id="status-dot"></div>
    <div id="status-text">disconnected</div>
  </div>
  <div id="table-wrap">
    <div id="placeholder">
      <div class="big">⚡</div>
      <div>Choose an ECU node from the sidebar</div>
    </div>
  </div>
</div>

<script>
const WS_URL = `ws://${location.host}/ws`;

// ---- state ----
let ws = null;
let activeNode = null;
// msgId -> { name, lastTs, signals: { signalName -> { value, label, units } } }
const msgState = new Map();
// msgId -> { section, ageEl, rows: { signalName -> { valueTd, labelTd } } }
const msgDom = new Map();

let frameCount = 0;
let lastFpsTs = performance.now();

// ---- DOM refs ----
const nodeList    = document.getElementById('node-list');
const nodeTitle   = document.getElementById('node-title');
const tableWrap   = document.getElementById('table-wrap');
const placeholder = document.getElementById('placeholder');
const filterInput = document.getElementById('filter-input');
const statusDot   = document.getElementById('status-dot');
const statusText  = document.getElementById('status-text');
const fpsCounter  = document.getElementById('fps-counter');

// ---- WebSocket ----
function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    statusDot.className = 'connected';
    statusText.textContent = 'connected';
    if (activeNode) subscribe(activeNode);
  };

  ws.onclose = () => {
    statusDot.className = '';
    statusText.textContent = 'reconnecting…';
    setTimeout(connect, 1500);
  };

  ws.onerror = () => {
    statusDot.className = 'error';
    statusText.textContent = 'error';
  };

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if      (msg.type === 'db')     handleDb(msg);
    else if (msg.type === 'schema') handleSchema(msg);
    else if (msg.type === 'frame')  handleFrame(msg);
  };
}

// ---- handlers ----
function handleDb(msg) {
  nodeList.innerHTML = '';
  msg.nodes.forEach(node => {
    const btn = document.createElement('button');
    btn.className = 'node-btn';
    btn.textContent = node;
    btn.addEventListener('click', () => selectNode(node));
    nodeList.appendChild(btn);
  });
}

function handleSchema(msg) {
  msgState.clear();
  msgDom.clear();
  tableWrap.innerHTML = '';
  placeholder.style.display = 'none';
  filterInput.style.display = '';

  msg.messages.forEach(m => {
    msgState.set(m.id, { name: m.name, lastTs: null, signals: {} });
    m.signals.forEach(s => {
      msgState.get(m.id).signals[s.signal] = { value: '—', label: null, units: s.units };
    });
    buildMsgSection(m);
  });

  applyFilter();
}

function handleFrame(msg) {
  frameCount++;
  const state = msgState.get(msg.msg_id);
  if (!state) return;

  state.lastTs = msg.timestamp;

  msg.signals.forEach(s => {
    const cur = state.signals[s.signal];
    if (!cur) return;
    const changed = cur.value !== s.value || cur.label !== s.label;
    cur.value = s.value;
    cur.label = s.label || null;

    const dom = msgDom.get(msg.msg_id);
    if (!dom) return;
    const row = dom.rows[s.signal];
    if (!row) return;

    const formatted = formatValue(s.value, s.units);
    if (row.valueTd.textContent !== formatted) {
      row.valueTd.textContent = formatted;
      if (changed) flashCell(row.valueTd);
    }
    row.labelTd.textContent = s.label || '';
  });
}

// ---- DOM builders ----
function buildMsgSection(m) {
  const section = document.createElement('div');
  section.className = 'msg-section';
  section.dataset.msgId = m.id;

  const header = document.createElement('div');
  header.className = 'msg-header';

  const nameEl = document.createElement('span');
  nameEl.className = 'msg-name';
  nameEl.textContent = m.name;

  const idEl = document.createElement('span');
  idEl.className = 'msg-id';
  idEl.textContent = `0x${m.id.toString(16).toUpperCase().padStart(3,'0')}`;

  const ageEl = document.createElement('span');
  ageEl.className = 'msg-age';
  ageEl.textContent = '—';

  header.append(nameEl, idEl, ageEl);
  section.appendChild(header);

  const table = document.createElement('table');
  const rows = {};

  m.signals.forEach(s => {
    const tr = document.createElement('tr');
    tr.dataset.signal = s.signal;

    const nameTd = document.createElement('td');
    nameTd.className = 'sig-name';
    nameTd.textContent = s.signal;

    const valueTd = document.createElement('td');
    valueTd.className = 'sig-value';
    valueTd.textContent = '—';

    const unitsTd = document.createElement('td');
    unitsTd.className = 'sig-units';
    unitsTd.textContent = s.units || '';

    const labelTd = document.createElement('td');
    labelTd.className = 'sig-label';

    tr.append(nameTd, valueTd, unitsTd, labelTd);
    table.appendChild(tr);
    rows[s.signal] = { tr, valueTd, labelTd };
  });

  section.appendChild(table);
  tableWrap.appendChild(section);
  msgDom.set(m.id, { section, ageEl, rows });
}

// ---- age ticker ----
setInterval(() => {
  const now = Date.now() / 1000;
  msgDom.forEach((dom, id) => {
    const state = msgState.get(id);
    if (!state || state.lastTs === null) return;
    const age = now - state.lastTs;
    const stale = age > 1.0;
    dom.ageEl.textContent = age < 10 ? `${age.toFixed(1)}s` : `${age.toFixed(0)}s`;
    dom.ageEl.className = 'msg-age' + (stale ? ' stale' : '');
  });
}, 250);

// ---- fps counter ----
setInterval(() => {
  const now = performance.now();
  const elapsed = (now - lastFpsTs) / 1000;
  fpsCounter.textContent = `${(frameCount / elapsed).toFixed(0)} fps`;
  frameCount = 0;
  lastFpsTs = now;
}, 1000);

// ---- filter ----
filterInput.addEventListener('input', applyFilter);

function applyFilter() {
  const q = filterInput.value.trim().toLowerCase();
  msgDom.forEach((dom, id) => {
    let msgVisible = false;
    Object.entries(dom.rows).forEach(([sig, { tr }]) => {
      const show = !q || sig.toLowerCase().includes(q);
      tr.style.display = show ? '' : 'none';
      if (show) msgVisible = true;
    });
    dom.section.style.display = msgVisible ? '' : 'none';
  });
}

// ---- node selection ----
function selectNode(node) {
  activeNode = node;
  document.querySelectorAll('.node-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === node);
  });
  nodeTitle.textContent = node.toUpperCase();
  filterInput.value = '';
  if (ws && ws.readyState === WebSocket.OPEN) subscribe(node);
}

function subscribe(node) {
  ws.send(JSON.stringify({ type: 'subscribe', node }));
}

// ---- helpers ----
function formatValue(v, units) {
  if (typeof v === 'number') {
    return Number.isInteger(v) ? String(v) : v.toFixed(4).replace(/\.?0+$/, '');
  }
  return String(v);
}

function flashCell(td) {
  td.classList.remove('flash');
  void td.offsetWidth; // reflow
  td.classList.add('flash');
  setTimeout(() => td.classList.remove('flash'), 300);
}

connect();
</script>
</body>
</html>
